<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#35523A"/>
  <!-- Left tree (shorter, muted) -->
  <path d="M5 24 Q8 12 11 24Z" fill="#9EBA9A"/>
