  <!-- Centre tree (tallest, brightest) -->
  <path d="M12 24 Q16 7 20 24Z" fill="#C4D8C0"/>
  <line x1="16" y1="24" x2="16" y2="27.5" stroke="#C4D8C0" stroke-width="2" stroke-linecap="round"/>
  <!-- Right tree (medium, mid-tone) -->
  <path d="M21 24 Q24 13 27 24Z" fill="#A8C0A4"/>
  <line x1="24" y1="24" x2="24" y2="27.5" stroke="#A8C0A4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
