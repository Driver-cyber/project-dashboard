<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --amber: #F2A24A;
      --sienna: #E8855A;
      --wheat: #F5DEB3;
      --walnut: #2C1A0E;
      --walnut-mid: #3D2410;
      --walnut-light: #4A2E18;
      --rust: #7A3B1E;
      --green: #6FCF97;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--walnut);
      color: var(--wheat);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding-bottom: 64px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--walnut-light);
      position: sticky;
      top: 0;
      background: var(--walnut);
      z-index: 10;
    }
    .header-left h1 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--amber);
    }
    .header-left p {
      font-size: 11px;
      color: var(--rust);
      margin-top: 2px;
    }
    .refresh-btn {
      background: var(--walnut-mid);
      border: 1px solid var(--walnut-light);
      color: var(--wheat);
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .refresh-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Grid */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 16px;
      padding: 24px 28px;
    }
    @media (max-width: 500px) {
      #grid { grid-template-columns: 1fr; padding: 14px; }
      header { padding: 16px 14px 14px; }
    }

    /* Card */
    .card {
      background: var(--walnut-mid);
      border: 1px solid var(--walnut-light);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--walnut-light);
      gap: 12px;
    }
    .card-name {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      color: var(--amber);
      font-weight: 600;
      line-height: 1.2;
    }
    .card-desc {
      font-size: 11px;
      color: var(--rust);
      margin-top: 3px;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .stale-badge {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Columns inside card */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .cols.single { grid-template-columns: 1fr; }
    .mini-col {
      padding: 12px 14px 14px;
      border-right: 1px solid var(--walnut-light);
    }
    .mini-col:last-child { border-right: none; }
    .mini-col-header {
      font-size: 10px;
      font-weight: 600;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    ol.mini-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    ol.mini-list li {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      font-size: 12px;
      color: var(--wheat);
      line-height: 1.35;
    }
    .num {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      background: rgba(242,162,74,0.18);
      color: var(--amber);
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .no-priorities {
      font-size: 11px;
      color: var(--rust);
      font-style: italic;
    }

    /* Skeleton loading */
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.85; }
    }
    .skeleton { animation: pulse 1.8s ease-in-out infinite; }
    .skeleton-top  { height: 60px;  border-bottom: 1px solid var(--walnut-light); }
    .skeleton-body { height: 112px; }

    /* Error card */
    .error-card .card-name { color: var(--sienna); }
    .error-body {
      padding: 14px;
      font-size: 11px;
      color: var(--rust);
      font-style: italic;
    }

    /* Empty state */
    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 65vh;
      text-align: center;
      padding: 32px;
      gap: 14px;
    }
    #empty h2 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 20px;
      color: var(--amber);
      opacity: 0.55;
    }
    #empty p {
      font-size: 13px;
      color: var(--rust);
      line-height: 1.65;
      max-width: 300px;
    }
    #empty code {
      font-family: monospace;
      background: var(--walnut-mid);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--wheat);
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Projects</h1>
    <p id="subtitle">Loading…</p>
  </div>
  <button class="refresh-btn" id="refresh-btn" title="Refresh all trackers">↻</button>
</header>

<div id="empty">
  <h2>No projects configured</h2>
  <p>Add entries to <code>projects.json</code> in this repo to populate the dashboard.</p>
</div>

<div id="grid"></div>

<script>
  const ORG = 'Driver-cyber'

  function staleInfo(dateStr) {
    if (!dateStr) return { label: 'No date', color: 'var(--rust)' }
    const days = Math.floor((Date.now() - new Date(dateStr)) / 86400000)
    if (days <= 0)  return { label: 'Updated today',           color: 'var(--green)'  }
    if (days === 1) return { label: 'Updated yesterday',        color: 'var(--amber)'  }
    if (days < 7)   return { label: `${days} days ago`,         color: 'var(--amber)'  }
    if (days < 14)  return { label: '1 week ago — update due',  color: 'var(--sienna)' }
    const w = Math.floor(days / 7)
    return { label: `${w} weeks ago — stale`, color: 'var(--sienna)' }
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  function cardHTML(p) {
    const { label, color } = staleInfo(p.updated)
    const cols = p.columns || []
    const colsHTML = cols.map(col => {
      const items = (col.priorities || []).slice(0, 3)
      const list = items.length
        ? `<ol class="mini-list">${items.map((pr, i) =>
            `<li><span class="num">${i+1}</span>${esc(pr.title)}</li>`
          ).join('')}</ol>`
        : `<p class="no-priorities">No priorities set</p>`
      return `<div class="mini-col">
        <div class="mini-col-header">${esc(col.name)}</div>
        ${list}
      </div>`
    }).join('')

    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-name">${esc(p.project)}</div>
          <div class="card-desc">${esc(p.description || '')}</div>
        </div>
        <div class="card-meta">
          <span class="stale-badge" style="color:${color}">${esc(label)}</span>
        </div>
      </div>
      <div class="cols${cols.length === 1 ? ' single' : ''}">${colsHTML}</div>
    </div>`
  }

  function skeletonHTML() {
    return `<div class="card skeleton">
      <div class="skeleton-top"></div>
      <div class="skeleton-body"></div>
    </div>`
  }

  function errorCardHTML(repo, msg) {
    return `<div class="card error-card">
      <div class="card-top">
        <div>
          <div class="card-name">${esc(repo)}</div>
          <div class="card-desc">${esc(msg)}</div>
        </div>
      </div>
      <div class="error-body">Could not fetch tracker — check repo name and tracker filename in projects.json</div>
    </div>`
  }

  async function fetchTracker({ repo, tracker }) {
    const url = `https://api.github.com/repos/${ORG}/${repo}/contents/${tracker}.html`
    const r = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } })
    if (!r.ok) throw new Error(`GitHub ${r.status}`)
    const { content } = await r.json()
    const bytes = Uint8Array.from(atob(content.replace(/\n/g, '')), c => c.charCodeAt(0))
    const html = new TextDecoder('utf-8').decode(bytes)
    const doc = new DOMParser().parseFromString(html, 'text/html')
    const el = doc.querySelector('#tracker-data')
    if (!el) throw new Error('No #tracker-data block')
    return JSON.parse(el.textContent)
  }

  async function init() {
    const grid     = document.getElementById('grid')
    const empty    = document.getElementById('empty')
    const subtitle = document.getElementById('subtitle')
    const btn      = document.getElementById('refresh-btn')

    subtitle.textContent = 'Loading…'
    btn.disabled = true
    btn.classList.add('spinning')

    let projects
    try {
      const r = await fetch('./projects.json')
      if (!r.ok) throw new Error()
      projects = await r.json()
    } catch {
      subtitle.textContent = 'Error: could not load projects.json'
      btn.disabled = false
      btn.classList.remove('spinning')
      return
    }

    if (!projects.length) {
      empty.style.display = 'flex'
      grid.innerHTML = ''
      subtitle.textContent = 'No projects configured'
      btn.disabled = false
      btn.classList.remove('spinning')
      return
    }

    empty.style.display = 'none'
    grid.innerHTML = projects.map(skeletonHTML).join('')

    const results = await Promise.allSettled(projects.map(fetchTracker))

    let ok = 0
    grid.innerHTML = results.map((r, i) => {
      if (r.status === 'fulfilled') { ok++; return cardHTML(r.value) }
      return errorCardHTML(projects[i].repo, r.reason.message)
    }).join('')

    const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    subtitle.textContent = ok === projects.length
      ? `${ok} project${ok !== 1 ? 's' : ''} · fetched ${t}`
      : `${ok} of ${projects.length} fetched · ${t}`

    btn.disabled = false
    btn.classList.remove('spinning')
  }

  document.getElementById('refresh-btn').addEventListener('click', init)
  init()
</script>
</body>
</html>
